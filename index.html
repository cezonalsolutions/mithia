
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>METHAI Splash Screen</title>

<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
}

body {
  background: #EDE7FF;
  overflow: hidden;
}

.splash {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #EDE7FF;
}

.logo {
  width: min(72vw, 380px);
  height: auto;
  overflow: visible;
}

.logo text {
  font-family: 'Kalam', cursive;
  font-size: 130px;
  font-weight: 400;
  fill: #E82B65;
  stroke: #E82B65;
  stroke-width: 2.5;
  stroke-linejoin: round;
  paint-order: stroke fill;
}
</style>
</head>

<body>

<div class="splash">
  <svg
    class="logo"
    id="methaiLogo"
    viewBox="0 0 800 210"
    xmlns="http://www.w3.org/2000/svg"
    role="img"
    aria-label="METHAI"
  ></svg>
</div>

<script>
const WORD = "METHAI";
const SVG_NS = "http://www.w3.org/2000/svg";

const DURATION = 2000;
const LETTER_START = 50;
const LETTER_STEP = 225;
const DRAW_TIME = 270;

const svg = document.getElementById("methaiLogo");
const group = document.createElementNS(SVG_NS, "g");

svg.appendChild(group);

const letters = [];

for (let i = 0; i < WORD.length; i++) {
  const letter = document.createElementNS(SVG_NS, "text");

  letter.textContent = WORD[i];
  letter.setAttribute("x", "0");
  letter.setAttribute("y", "143");

  group.appendChild(letter);
  letters.push(letter);
}

async function startSplash() {
  try {
    await document.fonts.load('400 130px "Kalam"', WORD);
  } catch (error) {
    console.warn("Font loading:", error);
  }

  let cursor = 0;

  letters.forEach(letter => {
    letter.setAttribute("x", cursor);
    cursor += letter.getComputedTextLength() + 4;
  });

  const scale = Math.min(1, 720 / cursor);
  const offset = (800 - cursor * scale) / 2;

  group.setAttribute(
    "transform",
    `translate(${offset} 0) scale(${scale} 1)`
  );

  letters.forEach((letter, i) => {
    const length = Math.max(
      700,
      letter.getComputedTextLength() * 8
    );

    letter.style.strokeDasharray = length;
    letter.style.strokeDashoffset = length;
    letter.style.fillOpacity = 0;

    const start = LETTER_START + i * LETTER_STEP;
    const end = start + DRAW_TIME;

    letter.animate([
      {
        offset: 0,
        strokeDashoffset: length,
        fillOpacity: 0
      },
      {
        offset: start / DURATION,
        strokeDashoffset: length,
        fillOpacity: 0
      },
      {
        offset: end / DURATION,
        strokeDashoffset: 0,
        fillOpacity: 0
      },
      {
        offset: (end + 60) / DURATION,
        strokeDashoffset: 0,
        fillOpacity: 1
      },
      {
        offset: 0.90,
        strokeDashoffset: 0,
        fillOpacity: 1
      },
      {
        offset: 1,
        strokeDashoffset: length,
        fillOpacity: 0
      }
    ], {
      duration: DURATION,
      iterations: Infinity,
      easing: "linear"
    });
  });
}

startSplash();
</script>

</body>
</html>
