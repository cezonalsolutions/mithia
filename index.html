
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>METHAI - Font Studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #f5f6fa;
  color: #202124;
  font-family: Arial, sans-serif;
  padding-bottom: 30px;
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: #ffffff;
  padding: 16px 20px;
  box-shadow: 0 3px 15px #00000010;
}

header h2 {
  font-size: 21px;
  margin-bottom: 5px;
}

.subtitle {
  color: #777;
  font-size: 13px;
  margin-bottom: 14px;
}

.search {
  width: 100%;
  border: 1px solid #e2e2e2;
  background: #f8f8f8;
  border-radius: 12px;
  padding: 13px 15px;
  font-size: 15px;
  outline: none;
}

.search:focus {
  border-color: #8b5cf6;
  background: #fff;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 12px;
}

.count {
  font-size: 13px;
  color: #777;
}

.shuffle-btn {
  background: #202124;
  border: none;
  color: white;
  padding: 9px 14px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 12px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
  padding: 18px;
}

.font-card {
  background: #ffffff;
  border: 2px solid transparent;
  border-radius: 18px;
  min-height: 155px;
  padding: 15px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
  transition: transform .2s, box-shadow .2s;
}

.font-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 7px 22px #00000012;
}

.font-card.selected {
  border-color: #8b5cf6;
}

.font-number {
  color: #999;
  font-size: 12px;
  font-family: Arial, sans-serif;
}

.font-preview {
  font-size: clamp(25px, 3.3vw, 50px);
  line-height: 1.3;
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
}

.font-name {
  font-family: Arial, sans-serif;
  font-size: 12px;
  color: #777;
  text-align: center;
}

.selected-panel {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #00000099;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 15px;
}

.selected-panel.show {
  display: flex;
}

.preview-box {
  width: 100%;
  max-width: 650px;
  background: white;
  border-radius: 24px;
  padding: 35px 20px;
  text-align: center;
  position: relative;
}

.close-icon {
  position: absolute;
  right: 15px;
  top: 12px;
  border: none;
  background: #f1f1f1;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 19px;
}

#selectedLogo {
  font-size: clamp(45px, 10vw, 105px);
  line-height: 1.3;
  margin: 25px 0 10px;
  white-space: nowrap;
  overflow: hidden;
}

#selectedName {
  color: #666;
  font-size: 14px;
  margin-bottom: 20px;
}

.color-row {
  display: flex;
  justify-content: center;
  gap: 9px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.color-dot {
  width: 29px;
  height: 29px;
  border: 2px solid #e5e5e5;
  border-radius: 50%;
  cursor: pointer;
}

.close-btn {
  background: #202124;
  border: none;
  color: white;
  padding: 12px 28px;
  border-radius: 10px;
  cursor: pointer;
}

@media(max-width: 850px) {
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    padding: 10px;
  }

  .font-card {
    min-height: 130px;
    padding: 11px;
  }

  .font-preview {
    font-size: clamp(24px, 6vw, 40px);
  }

  header {
    padding: 13px;
  }
}

@media(max-width: 370px) {
  .font-preview {
    font-size: 23px;
  }
}
</style>
</head>

<body>

<header>
  <h2>METHAI — Font Studio</h2>
  <div class="subtitle">
    Explore fonts, colors and logo styles
  </div>

  <input
    class="search"
    id="search"
    placeholder="Search font name or number..."
    oninput="filterFonts()"
  >

  <div class="toolbar">
    <div class="count" id="count"></div>
    <button class="shuffle-btn" onclick="shuffleColors()">
      Change All Colors
    </button>
  </div>
</header>

<div class="grid" id="fontGrid"></div>

<div class="selected-panel" id="selectedPanel">
  <div class="preview-box">
    <button class="close-icon" onclick="closePreview()">
      &times;
    </button>

    <div id="selectedLogo">METHAI</div>
    <div id="selectedName"></div>

    <div class="color-row" id="colorRow"></div>

    <button class="close-btn" onclick="closePreview()">
      Back to Fonts
    </button>
  </div>
</div>

const weights = [400, 700];

const styles = [];

[...new Set(families)].forEach(family => {
  weights.forEach(weight => {
    styles.push({ family, weight });
  });
});

const colors = [
  "#ff6500",
  "#e63946",
  "#ff006e",
  "#8338ec",
  "#3a0ca3",
  "#4361ee",
  "#0077b6",
  "#0096c7",
  "#008f5a",
  "#00a86b",
  "#2d6a4f",
  "#d97706",
  "#f72585",
  "#7209b7",
  "#1d3557",
  "#111827",
  "#dc2626",
  "#7c3aed",
  "#0891b2",
  "#ca8a04",
  "#be123c",
  "#0f766e",
  "#b45309",
  "#6d28d9"
];

const grid = document.getElementById("fontGrid");
const loadedFonts = new Set();

let colorOffset = 0;
let selectedIndex = -1;

function getColor(index) {
  return colors[(index + colorOffset) % colors.length];
}

function loadFont(family, weight) {
  const key = family + "-" + weight;

  if (loadedFonts.has(key)) return;
  loadedFonts.add(key);

  const link = document.createElement("link");
  link.rel = "stylesheet";

  const familyParam =
    encodeURIComponent(family).replace(/%20/g, "+");

  link.href =
    "https://fonts.googleapis.com/css2?family=" +
    familyParam +
    ":wght@" + weight +
    "&display=swap";

  link.onerror = () => {
    loadedFonts.delete(key);
  };

  document.head.appendChild(link);
}

const observer = new IntersectionObserver(
  entries => {
    entries.forEach(entry => {
      if (!entry.isIntersecting) return;

      const card = entry.target;
      const index = Number(card.dataset.index);
      const style = styles[index];

      loadFont(style.family, style.weight);
      observer.unobserve(card);
    });
  },
  { rootMargin: "250px" }
);

function createCards() {
  const fragment = document.createDocumentFragment();

  styles.forEach((style, index) => {
    const card = document.createElement("div");
    card.className = "font-card";
    card.dataset.index = index;

    const number = document.createElement("div");
    number.className = "font-number";
    number.textContent = "#" + (index + 1);

    const preview = document.createElement("div");
    preview.className = "font-preview";
    preview.textContent = "METHAI";

    preview.style.fontFamily =
      '"' + style.family + '", sans-serif';
    preview.style.fontWeight = style.weight;
    preview.style.color = getColor(index);

    const name = document.createElement("div");
    name.className = "font-name";
    name.textContent =
      style.family + " — " + style.weight;

    card.append(number, preview, name);

    card.addEventListener("click", () => {
      selectFont(index, card);
    });

    fragment.appendChild(card);
  });

  grid.appendChild(fragment);

  document.querySelectorAll(".font-card")
    .forEach(card => observer.observe(card));

  updateCount();
}

function selectFont(index, card) {
  selectedIndex = index;

  const style = styles[index];

  loadFont(style.family, style.weight);

  document.querySelectorAll(".font-card.selected")
    .forEach(el => el.classList.remove("selected"));

  card.classList.add("selected");

  const logo = document.getElementById("selectedLogo");

  logo.style.fontFamily =
    '"' + style.family + '", sans-serif';
  logo.style.fontWeight = style.weight;
  logo.style.color = getColor(index);

  document.getElementById("selectedName").textContent =
    "#" + (index + 1) + " — " +
    style.family + " (" + style.weight + ")";

  createColorOptions();

  document.getElementById("selectedPanel")
    .classList.add("show");
}

function createColorOptions() {
  const row = document.getElementById("colorRow");
  row.innerHTML = "";

  colors.forEach(color => {
    const dot = document.createElement("button");
    dot.className = "color-dot";
    dot.style.background = color;
    dot.title = color;

    dot.onclick = () => {
      document.getElementById("selectedLogo")
        .style.color = color;
    };

    row.appendChild(dot);
  });
}

function closePreview() {
  document.getElementById("selectedPanel")
    .classList.remove("show");
}

function shuffleColors() {
  colorOffset = (colorOffset + 5) % colors.length;

  document.querySelectorAll(".font-card")
    .forEach((card, index) => {
      card.querySelector(".font-preview")
        .style.color = getColor(index);
    });
}

function filterFonts() {
  const query = document.getElementById("search")
    .value.toLowerCase().trim();

  document.querySelectorAll(".font-card")
    .forEach((card, index) => {
      const style = styles[index];

      const matches =
        style.family.toLowerCase().includes(query) ||
        String(index + 1) === query ||
        String(style.weight).includes(query);

      card.style.display = matches ? "flex" : "none";

      if (matches) observer.observe(card);
    });

  updateCount();
}

function updateCount() {
  let visible = 0;

  document.querySelectorAll(".font-card")
    .forEach(card => {
      if (card.style.display !== "none") visible++;
    });

  document.getElementById("count").textContent =
    visible + " of " + styles.length + " styles";
}

createCards();
</script>
